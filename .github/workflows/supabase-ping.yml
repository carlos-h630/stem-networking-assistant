name: Keep Supabase Alive

on:
  schedule:
    # Runs every 5 days at midnight UTC
    - cron: '0 0 */5 * *'
  workflow_dispatch: 
    # Allows you to run it manually from the GitHub Actions tab to test

jobs:
  ping-supabase:
    runs-on: ubuntu-latest
    steps:
      - name: Send API request to prevent pausing
        run: |
          curl -X GET "${{ secrets.SUPABASE_URL }}/rest/v1/" \
          -H "apikey: ${{ secrets.SUPABASE_ANON_KEY }}"
